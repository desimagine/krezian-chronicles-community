.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;rw-death-nearby-sounds&#x27;);
      if (!root) return;
      const one = selector =&gt; root.querySelector(selector);
      const camera = one(&#x27;[data-rw-camera]&#x27;);
      const focus = one(&#x27;[data-rw-focus]&#x27;);
      const stageLabel = one(&#x27;[data-rw-stage-label]&#x27;);
      const units = [1, 2, 3].map(n =&gt; one(`[data-rw-unit=&quot;${n}&quot;]`));
      const positions = [{x:108,y:54}, {x:-72,y:36}, {x:-36,y:126}];
      const button = one(&#x27;[data-rw-play]&#x27;);
      const soundInput = one(&#x27;[data-rw-sound]&#x27;);
      const choice = one(&#x27;[data-rw-choice]&#x27;);
      const audition = one(&#x27;[data-rw-audition]&#x27;);
      const credit = one(&#x27;[data-rw-credit]&#x27;);
      const studyAudio = JSON.parse(one(&#x27;[data-rw-assets]&#x27;).textContent);
      const audioAssets = studyAudio.candidates;
      const rawBuffers = new Map();
      const buffers = new Map();
      const status = one(&#x27;[data-rw-status]&#x27;);
      const aliveMask = one(&#x27;#rw-sound-study-alive-mask&#x27;);
      const redMask = one(&#x27;#rw-sound-study-red-mask&#x27;);
      const svg = one(&#x27;.rw-stage&#x27;);
      const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
      const motion = matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
      const groups = Array.from({length: 20}, () =&gt; &#x27;&#x27;);
      let seed = 18796;
      const random = () =&gt; {
        seed = (Math.imul(seed, 1664525) + 1013904223) &gt;&gt;&gt; 0;
        return seed / 4294967296;
      };
      // Small squares are packed into 20 paths per mask, not one DOM node per pixel.
      for (let y = -35; y &lt; 0; y += 1) {
        for (let x = -13; x &lt; 13; x += 1) {
          groups[Math.floor(random() * groups.length)] += `M${x} ${y}h1v1h-1Z`;
        }
      }
      const makePaths = mask =&gt; groups.map(d =&gt; {
        const path = document.createElementNS(ns, &#x27;path&#x27;);
        path.setAttribute(&#x27;d&#x27;, d);
        path.setAttribute(&#x27;fill&#x27;, &#x27;white&#x27;);
        path.setAttribute(&#x27;shape-rendering&#x27;, &#x27;crispEdges&#x27;);
        mask.append(path);
        return path;
      });
      const alivePaths = makePaths(aliveMask);
      const redPaths = makePaths(redMask);
      let raf = 0;
      let running = false;
      let context = null;
      let activeSound = null;
      let preparingSolo = false;
      let frameStart = null;
      let lastPhase = -99;
      let audioIssue = &#x27;&#x27;;
      const duration = 900;
      const approach = 340;
      const beat = approach + duration + 100;
      const delay = 350;
      const returnDuration = 440;
      let activeIndex = -1;
      let soundedIndex = -1;
      let width = 736;
      let baseScale = 1.55;
      let cameraPose = {x:0,y:66,zoom:1};
      const initialPose = {x:0,y:66,zoom:1};
      const smooth = value =&gt; { const t = Math.min(1, Math.max(0, value)); return t*t*(3-2*t); };
      const targetPose = index =&gt; ({x:positions[index].x*.7, y:positions[index].y-6, zoom:1.25});
      function paintCamera(pose) {
        cameraPose = pose;
        const scale = baseScale * pose.zoom;
        camera.setAttribute(&#x27;transform&#x27;, `translate(${width/2-pose.x*scale} ${184-pose.y*scale}) scale(${scale})`);
      }
      function blendCamera(from, to, progress) {
        const t = smooth(progress);
        paintCamera({x:from.x+(to.x-from.x)*t,y:from.y+(to.y-from.y)*t,zoom:from.zoom+(to.zoom-from.zoom)*t});
      }
      const floor = one(&#x27;[data-rw-ground]&#x27;);
      for (let row=0; row&lt;5; row++) for (let column=0; column&lt;5; column++) {
        const tile = document.createElementNS(ns, &#x27;path&#x27;);
        tile.setAttribute(&#x27;d&#x27;, &#x27;M -36 0 L 0 -18 L 36 0 L 0 18 Z&#x27;);
        tile.setAttribute(&#x27;class&#x27;, &#x27;rw-ground&#x27;);
        tile.setAttribute(&#x27;transform&#x27;, `translate(${(column-row)*36} ${(column+row)*18})`);
        floor.append(tile);
      }
      const setMaskPhase = phase =&gt; {
        if (phase === lastPhase) return;
        lastPhase = phase;
        alivePaths.forEach((p, i) =&gt; p.setAttribute(&#x27;opacity&#x27;, i &gt;= phase + 6 ? &#x27;1&#x27; : &#x27;0&#x27;));
        redPaths.forEach((p, i) =&gt; p.setAttribute(&#x27;opacity&#x27;, i &gt;= phase &amp;&amp; i &lt; phase + 6 ? &#x27;1&#x27; : &#x27;0&#x27;));
        root.dataset.phase = String(phase);
      };
      function stopSound() {
        if (!activeSound || !context) return;
        const now = context.currentTime;
        activeSound.gain.gain.cancelScheduledValues(now);
        activeSound.gain.gain.setTargetAtTime(0.0001, now, .01);
        activeSound.source.stop(now + .04);
        activeSound = null;
      }
      async function prepareAudio(solo = false) {
        audioIssue = &#x27;&#x27;;
        if (!soundInput.checked &amp;&amp; !solo) return;
        try {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) throw new Error(&#x27;AudioContext unavailable&#x27;);
          context ??= new Audio();
          await context.resume();
          if (context.state !== &#x27;running&#x27;) throw new Error(&#x27;AudioContext suspended&#x27;);
          if (!buffers.has(choice.value)) {
            const asset = audioAssets[choice.value];
            if (!rawBuffers.has(asset.sample)) {
              const bytes = Uint8Array.from(atob(studyAudio.samples[asset.sample]), char =&gt; char.charCodeAt(0));
              rawBuffers.set(asset.sample, await context.decodeAudioData(bytes.buffer));
            }
            let buffer = rawBuffers.get(asset.sample);
            if (asset.rate || asset.lowpassHz || asset.echoSeconds) {
              const OfflineAudio = window.OfflineAudioContext || window.webkitOfflineAudioContext;
              if (!OfflineAudio) throw new Error(&#x27;Offline audio unavailable&#x27;);
